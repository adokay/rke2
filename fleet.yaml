defaultNamespace: fleet-drift-test

kustomize:
  dir: ./base

helm:
  takeOwnership: true

targetCustomizations:
  - name: rancher-p-blue
    clusterSelector:
      matchLabels:
        management.cattle.io/cluster-display-name: rke2
    kustomize:
      dir: fleet-drift-test/base
    correctDrift:
      enabled: true
      force: true
      keepFailHistory: true
